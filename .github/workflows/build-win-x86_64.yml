name: Builder (Windows, x86_64)

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    strategy:
      matrix:
        noconsole: [false, true]
    with:
      os: Windows
      arch: x86_64
      artifact_name: PluginLoader-win${{ matrix.noconsole == true && '-noconsole' || '' }}
      binary_name: PluginLoader.exe
      noconsole: ${{ matrix.noconsole }}